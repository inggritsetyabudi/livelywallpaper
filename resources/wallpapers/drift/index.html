<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drift</title>
<style>
  /* Three drifting colour fields. Everything is transform-based so the
     compositor handles it and the wallpaper stays smooth on a 5K display. */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #05060f;
  }

  .field {
    position: absolute;
    width: 62vmax;
    height: 62vmax;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.75;
    will-change: transform;
  }

  .a { background: #4b2ce0; left: -8vmax;  top: -10vmax; animation: a 34s ease-in-out infinite alternate; }
  .b { background: #00c2d1; right: -12vmax; bottom: -6vmax; animation: b 41s ease-in-out infinite alternate; }
  .c { background: #c2189a; left: 30vmax;  bottom: 10vmax; animation: c 29s ease-in-out infinite alternate; opacity: 0.5; }

  /* A faint vignette keeps the edges from glowing against the desktop. */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
  }

  @keyframes a {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(18vmax, 10vmax, 0) scale(1.25); }
  }
  @keyframes b {
    from { transform: translate3d(0, 0, 0) scale(1.15); }
    to   { transform: translate3d(-16vmax, -12vmax, 0) scale(0.9); }
  }
  @keyframes c {
    from { transform: translate3d(0, 0, 0) scale(0.85); }
    to   { transform: translate3d(-10vmax, -14vmax, 0) scale(1.35); }
  }

  /* Respect the OS setting: a wallpaper should never fight the user for
     attention, and some people get motion sickness from looping animation. */
  @media (prefers-reduced-motion: reduce) {
    .field { animation: none; }
  }
</style>
</head>
<body>
  <div class="field a"></div>
  <div class="field b"></div>
  <div class="field c"></div>
  <div class="vignette"></div>
</body>
</html>
