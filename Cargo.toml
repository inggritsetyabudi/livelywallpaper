[package]
name = "livelywallpaper"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Native live wallpaper engine for macOS with a SwiftUI settings window"
license = "Apache-2.0"

# Only the crates actually linked into the binary. Everything here is used;
# adding an unused dependency costs build time and attack surface.
[dependencies]
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[build-dependencies]
cc = "1.0"

# Linux renderer support, off by default so `cargo build` succeeds on a machine
# without the media stack installed.
#
#   linux-wayland  wlr-layer-shell surfaces (Sway, Hyprland, river, niri, KDE 6)
#   linux-video    GStreamer video wallpapers
#   linux-web      WebKitGTK web wallpapers
[features]
default = ["linux-wayland"]
linux-wayland = []
linux-video = []
linux-web = []

# `cargo bundle` assembles Lively.app from the release binary. It runs after
# the normal build, so `cargo build --release && cargo bundle --release` produces
# something double-clickable.
[[bin]]
name = "livelywallpaper"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true